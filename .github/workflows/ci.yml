name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://image_generation:image_generation@127.0.0.1:5432/image_generation
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: image-generation-mvp-ci
      S3_ACCESS_KEY_ID: ci-only-key
      S3_SECRET_ACCESS_KEY: ci-only-secret
      S3_FORCE_PATH_STYLE: true
      MVP_DEMO_USER_ID: ci-demo-user
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: image_generation
          POSTGRES_PASSWORD: image_generation
          POSTGRES_DB: image_generation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U image_generation -d image_generation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh and repeated migrations
        run: npm run db:migrate:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Integration test
        run: npm run test:integration

      - name: Build
        run: npm run build
