name: CI
run-name: CI ${{ github.event_name }} PR-${{ github.event.pull_request.number || 'none' }} base-${{ github.event.pull_request.base.sha || github.sha }} head-${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://image_generation:image_generation@127.0.0.1:5432/image_generation
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: image-generation-mvp-ci
      S3_ACCESS_KEY_ID: ci-only-key
      S3_SECRET_ACCESS_KEY: ci-only-secret
      S3_FORCE_PATH_STYLE: true
      MVP_DEMO_USER_ID: ci-demo-user
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: image_generation
          POSTGRES_PASSWORD: image_generation
          POSTGRES_DB: image_generation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U image_generation -d image_generation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate autonomous control gate V2
        run: |
          node --check .github/scripts/autonomous-control-gate-v2.mjs
          node --check .github/scripts/autonomous-control-gate-v2.test.mjs
          node --test .github/scripts/autonomous-control-gate-v2.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify fresh and repeated migrations
        run: npm run db:migrate:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Integration test
        run: npm run test:integration

      - name: Build
        run: npm run build
