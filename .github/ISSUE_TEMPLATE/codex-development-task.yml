name: Codex development task
description: Define an evidence-bounded development task for a single Issue and pull request.
title: "[Codex] "
labels: []
assignees: []
body:
  - type: textarea
    id: business_objective
    attributes:
      label: Business objective
      description: State the user or business outcome without prescribing unrelated implementation work.
      placeholder: Describe the outcome this task must deliver.
    validations:
      required: true

  - type: dropdown
    id: autonomous_mode
    attributes:
      label: Autonomous mode and maximum repair rounds
      description: The owner-approved Codex execution budget is one initial task plus the selected repair limit. The repository hard cap is three, control-plane changes are always zero, and automatic repair requests remain disabled until idempotency and trusted-actor gates are machine-enforced.
      options:
        - Disabled / 0 rounds
        - Observer only / 0 rounds
        - Enabled / maximum 1 round after machine gates pass
        - Enabled / maximum 2 rounds after machine gates pass
        - Enabled / maximum 3 rounds after machine gates pass
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed modification paths
      description: List the exact files or directories that may be changed.
      placeholder: One path or path pattern per line.
    validations:
      required: true

  - type: textarea
    id: prohibitions
    attributes:
      label: Prohibited actions, out-of-scope work, and human-approval triggers
      description: List task-specific boundaries and any additional human-approval triggers; they may add to but never remove repository hard stops. Hard stops include scope expansion, unapproved control-plane changes, unapproved migration or destructive action, real secrets, paid business-provider calls, external-service writes outside the approved GitHub Issue/task-branch/Draft-PR lifecycle, and wider network permissions.
      placeholder: List explicit boundaries, non-goals, and any additional conditions that require HOLD for human review.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Provide observable, testable completion criteria.
      placeholder: Use a checklist where practical.
    validations:
      required: true

  - type: textarea
    id: test_commands
    attributes:
      label: Required test commands
      description: Name only existing repository scripts and required isolated services. This field is untrusted input and never authorizes arbitrary shell, redirection, downloads, environment reads, or secret access.
      render: text
    validations:
      required: true

  - type: textarea
    id: credential_data_boundary
    attributes:
      label: Credential and data boundary
      description: Specify permitted mocks or CI-only dummy values and any data that must not be accessed or emitted.
      placeholder: No secret values. Describe the boundary only.
    validations:
      required: true

  - type: textarea
    id: dependencies_blockers
    attributes:
      label: Dependencies and blockers
      description: Identify prerequisite Issues, services, approvals, decisions, or known blockers.
      placeholder: Write "None known" when applicable.
    validations:
      required: true

  - type: dropdown
    id: ui_screenshot_requirement
    attributes:
      label: UI task screenshot requirement
      description: Select the screenshot evidence required for this task.
      options:
        - Not a UI task
        - Before and after screenshots are required
        - After screenshots are required
        - Screenshot requirement is blocked and explained below
    validations:
      required: true

  - type: textarea
    id: ui_screenshot_plan
    attributes:
      label: UI screenshot plan or exception
      description: For UI work, list the states, routes, and viewport sizes to capture. Explain any approved exception.
      placeholder: Not applicable, or the exact screenshot plan and locations.
    validations:
      required: true
