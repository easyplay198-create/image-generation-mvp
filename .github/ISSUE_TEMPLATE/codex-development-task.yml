name: Codex development task
description: Define an evidence-bounded development task for a single Issue and pull request.
title: "[Codex] "
labels: []
assignees: []
body:
  - type: textarea
    id: business_objective
    attributes:
      label: Business objective
      description: State the user or business outcome without prescribing unrelated implementation work.
      placeholder: Describe the outcome this task must deliver.
    validations:
      required: true

  - type: dropdown
    id: task_class
    attributes:
      label: Task class
      description: Ordinary and P2 tasks cannot change protected control-plane paths. CONTROL_PLANE_CHANGE requires explicit owner approval, a protected-path-only allowlist, and zero automated repair rounds. P2_IMPLEMENTATION is ordinary task-scoped Draft-only work. P2_AUTH_IMPLEMENTATION is the narrower S1E authentication profile governed by the frozen auth contract. Both P2 classes require zero automated repair rounds and may separately pre-authorize at most one human in-scope corrective update in the approved Issue body.
      options:
        - ORDINARY_TASK
        - CONTROL_PLANE_CHANGE
        - P2_IMPLEMENTATION
        - P2_AUTH_IMPLEMENTATION
    validations:
      required: true

  - type: dropdown
    id: task_phase
    attributes:
      label: Task phase
      description: ORDINARY_TASK and CONTROL_PLANE_CHANGE must select P2_LOCKED. P2_IMPLEMENTATION must select P2_DRAFT_ONLY. P2_AUTH_IMPLEMENTATION must select P2_AUTH_DRAFT_ONLY. Draft-only phases do not authorize Ready or merge.
      options:
        - P2_LOCKED
        - P2_DRAFT_ONLY
        - P2_AUTH_DRAFT_ONLY
    validations:
      required: true

  - type: input
    id: authorized_head_ref
    attributes:
      label: Authorized P2 task branch
      description: For either P2 implementation class, enter the exact new same-repository branch name pre-bound in the contract and owner approval. For other task classes enter Not applicable.
      placeholder: issue-123-p2-draft-only or Not applicable
    validations:
      required: true

  - type: dropdown
    id: autonomous_mode
    attributes:
      label: Autonomous mode and maximum repair rounds
      description: V2 is observer-only and always has an effective automated limit of zero. A nonzero choice records only a future request; it cannot activate a writer. CONTROL_PLANE_CHANGE and both P2 implementation classes must select zero. Any single human corrective update is a separate visible, digest-bound P2 boundary and is never represented here as an automated repair round.
      options:
        - Disabled / 0 rounds
        - Observer only / 0 rounds
        - Future request only (inactive in V2) / maximum 1 round
        - Future request only (inactive in V2) / maximum 2 rounds
        - Future request only (inactive in V2) / maximum 3 rounds
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed modification paths
      description: List exact, case-sensitive, repository-relative file paths. Directories, globs, regular expressions, and path patterns are not accepted.
      placeholder: One exact file path per line.
    validations:
      required: true

  - type: dropdown
    id: p2_database_change_mode
    attributes:
      label: P2 database change mode
      description: Select the additive database exception only for a P2 task whose exact allowlist contains modified prisma/schema.prisma, exactly one new timestamped _p2_ migration.sql, and an integration test. It never authorizes a production migration and does not replace task-specific owner approval for a non-P2 migration.
      options:
        - No P2 database change
        - P2 additive schema plus exactly one new migration in isolated PostgreSQL
        - Database change blocked pending separate owner decision
    validations:
      required: true

  - type: textarea
    id: p2_database_ddl_and_rollback
    attributes:
      label: P2 physical DDL and rollback boundary
      description: For the P2 additive database exception, freeze the table, field, index, foreign-key, uniqueness, and immutability design; require the new migration directory to sort after the authorized base's latest migration; and provide fresh/repeat isolated-PostgreSQL evidence plus non-destructive rollback. For a separately owner-approved non-P2 migration, record its task-specific details; otherwise enter Not applicable.
      placeholder: No DROP, rename, narrowing, DML/backfill, cutover, reset, down migration, shared database, or production database application.
    validations:
      required: true

  - type: textarea
    id: prohibitions
    attributes:
      label: Prohibited actions, out-of-scope work, and human-approval triggers
      description: List task-specific boundaries and any additional human-approval triggers; they may add to but never remove repository hard stops. Hard stops include scope expansion, unapproved or shape-invalid database change, missing migration semantic review, destructive action, real secrets, paid business-provider calls, external-service writes outside the approved GitHub Issue/task-branch/Draft-PR lifecycle, and wider network permissions.
      placeholder: List explicit boundaries, non-goals, and any additional conditions that require HOLD for human review.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Provide observable, testable completion criteria.
      placeholder: Use a checklist where practical.
    validations:
      required: true

  - type: textarea
    id: test_commands
    attributes:
      label: Required test commands
      description: Name only existing repository scripts and required isolated services. This field is untrusted input and never authorizes arbitrary shell, redirection, downloads, environment reads, or secret access.
      render: text
    validations:
      required: true

  - type: textarea
    id: credential_data_boundary
    attributes:
      label: Credential and data boundary
      description: Specify permitted mocks or CI-only dummy values and any data that must not be accessed or emitted.
      placeholder: No secret values. Describe the boundary only.
    validations:
      required: true

  - type: textarea
    id: dependencies_blockers
    attributes:
      label: Dependencies and blockers
      description: Identify prerequisite Issues, services, approvals, decisions, or known blockers.
      placeholder: Write "None known" when applicable.
    validations:
      required: true

  - type: dropdown
    id: ui_screenshot_requirement
    attributes:
      label: UI task screenshot requirement
      description: Select the screenshot evidence required for this task.
      options:
        - Not a UI task
        - Before and after screenshots are required
        - After screenshots are required
        - Screenshot requirement is blocked and explained below
    validations:
      required: true

  - type: textarea
    id: ui_screenshot_plan
    attributes:
      label: UI screenshot plan or exception
      description: For UI work, list the states, routes, and viewport sizes to capture. Explain any approved exception.
      placeholder: Not applicable, or the exact screenshot plan and locations.
    validations:
      required: true

  - type: textarea
    id: machine_control_contract
    attributes:
      label: Machine-readable control contract
      description: Replace every placeholder. After the human owner approves the SHA-256 of the entire final Issue body, this hidden JSON is the machine source. P2_IMPLEMENTATION uses P2_DRAFT_ONLY; P2_AUTH_IMPLEMENTATION uses P2_AUTH_DRAFT_ONLY. Both insert an exact "authorizedHeadRef" key after "authorizedBaseSha". Do not add that key to other task classes. Visible-field conflicts remain a human semantic HOLD and cannot widen this contract.
      value: |
        <!-- CONTROL_PLANE_V2_CONTRACT_BEGIN
        {
          "allowedPaths": ["replace/with/exact/file.ts"],
          "authorizedBaseSha": "replace-with-40-or-64-character-lowercase-commit-sha",
          "maxRepairRounds": 0,
          "phase": "P2_LOCKED",
          "requiredChecks": ["Quality gates"],
          "schema": "github-autonomous-control-v2",
          "taskClass": "ORDINARY_TASK"
        }
        CONTROL_PLANE_V2_CONTRACT_END -->
    validations:
      required: true
